spring:
  application:
    name: pagamento

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Metricas via OTLP estao fora do escopo desta track (PRD: apenas traces).
  # Sem isso, o OtlpMeterRegistry tenta publicar em localhost:4318 dentro do container
  # e gera WARNs de conexao recusada a cada minuto.
  autoconfigure:
    exclude:
      - org.springframework.boot.micrometer.metrics.autoconfigure.export.otlp.OtlpMetricsExportAutoConfiguration

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pagamento}
    username: ${SPRING_DATASOURCE_USERNAME:assinatura}
    password: ${SPRING_DATASOURCE_PASSWORD:assinatura}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: pagamento
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
    template:
      observation-enabled: true

app:
  gateway:
    base-url: ${APP_GATEWAY_BASE_URL:http://mock-pagamento:8081}
    webhook-secret: ${APP_GATEWAY_WEBHOOK_SECRET:mock-webhook-secret}
    webhook-notification-url: ${APP_GATEWAY_WEBHOOK_NOTIFICATION_URL:http://pagamento:8080/webhooks/payments}
  renovacao:
    scheduler-intervalo-ms: ${APP_RENOVACAO_SCHEDULER_INTERVALO_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.globo: INFO
    org.apache.kafka: WARN
    org.springframework: WARN
    org.hibernate.orm: WARN
    org.flywaydb: WARN
