spring:
  application:
    name: pagamento

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pagamento}
    username: ${SPRING_DATASOURCE_USERNAME:pagamento}
    password: ${SPRING_DATASOURCE_PASSWORD:pagamento}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: pagamento
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  gateway:
    base-url: ${APP_GATEWAY_BASE_URL:http://mock-pagamento:8081}
    webhook-secret: ${APP_GATEWAY_WEBHOOK_SECRET:mock-webhook-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
