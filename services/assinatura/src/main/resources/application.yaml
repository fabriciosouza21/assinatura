spring:
  application:
    name: assinatura

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Desabilita o exportador de metricas OTLP para evitar tentativas de conexao locais; o servico exporta apenas traces.
  # Sem isso, o OtlpMeterRegistry tenta publicar em localhost:4318 dentro do container
  # e gera WARNs de conexao recusada a cada minuto.
  autoconfigure:
    exclude:
      - org.springframework.boot.micrometer.metrics.autoconfigure.export.otlp.OtlpMetricsExportAutoConfiguration

  task:
    scheduling:
      pool:
        # Schedulers de lote (publisher, recuperacao da DLQ e renovacao) rodam em
        # threads dedicadas: o envio Kafka bloqueante do publisher nao pode atrasar
        # os demais jobs agendados.
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:3}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assinatura}
    username: ${SPRING_DATASOURCE_USERNAME:assinatura}
    password: ${SPRING_DATASOURCE_PASSWORD:assinatura}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: assinatura
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${APP_KAFKA_PRODUCER_ACKS:all}
      retries: ${APP_KAFKA_PRODUCER_RETRIES:2147483647}
      properties:
        enable.idempotence: ${APP_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}
    template:
      observation-enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:ZmIxMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTBhYmNkZWYxMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTA=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  kafka:
    rotas-evento-topico:
      AssinaturaSolicitada: ${APP_KAFKA_ROTAS_ASSINATURA_SOLICITADA:assinatura-solicitada}
      RenovacaoSolicitada: ${APP_KAFKA_ROTAS_RENOVACAO_SOLICITADA:renovacao-solicitada}
      AssinaturaRenovada: ${APP_KAFKA_ROTAS_ASSINATURA_RENOVADA:assinatura-renovada}
      AssinaturaSuspensa: ${APP_KAFKA_ROTAS_ASSINATURA_SUSPENSA:assinatura-suspensa}
      CancelamentoAgendado: ${APP_KAFKA_ROTAS_CANCELAMENTO_AGENDADO:cancelamento-agendado}
      AssinaturaCancelada: ${APP_KAFKA_ROTAS_ASSINATURA_CANCELADA:assinatura-cancelada}
    topico-pagamento-status-atualizado: ${APP_KAFKA_TOPICO_PAGAMENTO_STATUS_ATUALIZADO:pagamento-status-atualizado}
    topico-pagamento-status-atualizado-dlq: ${APP_KAFKA_TOPICO_PAGAMENTO_STATUS_ATUALIZADO_DLQ:pagamento-status-atualizado-dlq}
    topico-renovacao-resultado: ${APP_KAFKA_TOPICO_RENOVACAO_RESULTADO:renovacao-resultado}
    topico-renovacao-resultado-dlq: ${APP_KAFKA_TOPICO_RENOVACAO_RESULTADO_DLQ:renovacao-resultado-dlq}
  outbox:
    intervalo-ms: ${APP_OUTBOX_INTERVALO_MS:5000}
    tamanho-lote: ${APP_OUTBOX_TAMANHO_LOTE:100}
    max-tentativas: ${APP_OUTBOX_MAX_TENTATIVAS:3}
    backoff-inicial-segundos: ${APP_OUTBOX_BACKOFF_INICIAL_SEGUNDOS:1}
    jitter-millis: ${APP_OUTBOX_JITTER_MILLIS:500}
    dlq:
      intervalo-ms: ${APP_OUTBOX_DLQ_INTERVALO_MS:60000}
      timeout-segundos: ${APP_OUTBOX_DLQ_TIMEOUT_SEGUNDOS:3600}
      max-ciclos: ${APP_OUTBOX_DLQ_MAX_CICLOS:3}
  renovacao:
    intervalo-ms: ${APP_RENOVACAO_INTERVALO_MS:60000}
    tamanho-lote: ${APP_RENOVACAO_TAMANHO_LOTE:100}
    # Duracao do ciclo de renovacao, em milissegundos. Default: 1 minuto (60000).
    # Menos de um dia faz a renovacao vencer no proprio dia da ativacao, disparando no
    # proximo ciclo do scheduler: util para testar o fluxo via Bruno. Producao: 30 dias.
    ciclo-ms: ${APP_RENOVACAO_CICLO_MS:60000}
  cache:
    # Tempo de vida das paginas da listagem em segundos; rede de seguranca caso
    # alguma invalidacao falhe.
    assinatura-lista-ttl: ${APP_CACHE_ASSINATURA_LISTA_TTL:300}
    # Tempo de vida da assinatura ativa em segundos; rede de seguranca caso
    # alguma invalidacao falhe.
    assinatura-ativa-ttl: ${APP_CACHE_ASSINATURA_ATIVA_TTL:300}

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.globo: INFO
    org.apache.kafka: WARN
    org.springframework: WARN
    org.hibernate.orm: WARN
    org.flywaydb: WARN
