spring:
  application:
    name: assinatura

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assinatura}
    username: ${SPRING_DATASOURCE_USERNAME:assinatura}
    password: ${SPRING_DATASOURCE_PASSWORD:assinatura}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: assinatura
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${APP_KAFKA_PRODUCER_ACKS:all}
      retries: ${APP_KAFKA_PRODUCER_RETRIES:2147483647}
      properties:
        enable.idempotence: ${APP_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}

app:
  jwt:
    secret: ${APP_JWT_SECRET:ZmIxMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTBhYmNkZWYxMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTA=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  kafka:
    topico-assinatura-solicitada: ${APP_KAFKA_TOPICO_ASSINATURA_SOLICITADA:assinatura-solicitada}
  outbox:
    intervalo-ms: ${APP_OUTBOX_INTERVALO_MS:5000}
    tamanho-lote: ${APP_OUTBOX_TAMANHO_LOTE:100}
    max-tentativas: ${APP_OUTBOX_MAX_TENTATIVAS:3}
    backoff-inicial-segundos: ${APP_OUTBOX_BACKOFF_INICIAL_SEGUNDOS:1}
    jitter-millis: ${APP_OUTBOX_JITTER_MILLIS:500}

management:
  endpoints:
    web:
      exposure:
        include: health
