info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{assinaturaUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
