info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{assinaturaUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "usuario.teste@example.com",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("token", res.body.token);
        expect(res.getStatus()).to.equal(200);
        expect(res.body.token, "token capturado").to.be.a('string');
        expect(res.body.tokenType).to.equal("Bearer");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
