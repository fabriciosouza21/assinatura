info:
  name: Cancelar assinatura
  type: http
  seq: 9

http:
  method: POST
  url: "{{assinaturaUrl}}/assinaturas/{{assinaturaId}}/cancelamento"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(200);
        expect(res.body.id, "id da assinatura").to.be.a('string');
        expect(res.body.status).to.be.oneOf(["CANCELADA", "ATIVA", "EM_RENOVACAO"]);
        // ATIVA/EM_RENOVACAO com renovação automática = cancelamento agendado
        // (acessoAte = fim do ciclo). Demais status = cancelamento imediato (CANCELADA).

settings:
  encodeUrl: true
