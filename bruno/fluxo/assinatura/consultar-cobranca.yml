info:
  name: Consultar cobranca
  type: http
  seq: 4

http:
  method: GET
  url: "{{pagamentoUrl}}/cobrancas/{{assinaturaId}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(200);
        expect(res.body.paymentId, "paymentId capturado").to.be.a('string');
        bru.setVar("paymentId", res.body.paymentId);

settings:
  encodeUrl: true
