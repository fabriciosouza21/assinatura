info:
  name: Consultar assinatura ativa
  type: http
  seq: 7

http:
  method: GET
  url: "{{assinaturaUrl}}/assinaturas/ativa"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(200);
        expect(res.body.id, "mesma assinatura ativa do dono do token").to.equal(bru.getVar("assinaturaId"));
        expect(res.body.status, "assinatura deve estar ATIVA").to.equal("ATIVA");
        expect(res.body.inicioCiclo, "inicio do ciclo de renovação").to.be.a('string');
        expect(res.body.fimCiclo, "fim do ciclo de renovação").to.be.a('string');
        expect(res.body.proximaRenovacaoEm, "data da próxima renovação").to.be.a('string');
        expect(res.body.renovacaoAutomatica).to.equal(true);
        bru.setVar("proximaRenovacaoEm", res.body.proximaRenovacaoEm);
        bru.setVar("fimCiclo", res.body.fimCiclo);

settings:
  encodeUrl: true
