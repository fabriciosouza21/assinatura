info:
  name: Cancelar assinatura
  type: http
  seq: 7

http:
  method: POST
  url: "{{assinaturaUrl}}/assinaturas/{{assinaturaId}}/cancelamento"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(200);
        expect(res.body.id, "id da assinatura").to.be.a('string');
        // ATIVA/EM_RENOVACAO com renovação automática = agendado (mantém status, acessoAte = fimCiclo).
        // Demais status = imediato (CANCELADA, acessoAte null).
        bru.setVar("statusAposCancelamento", res.body.status);

settings:
  encodeUrl: true
