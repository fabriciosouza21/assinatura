info:
  name: Consultar renovacao
  type: http
  seq: 1

http:
  method: GET
  url: "{{pagamentoUrl}}/renovacoes/{{assinaturaId}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("paymentId", res.body.paymentId);
        bru.setVar("renovacaoId", res.body.renovacaoId);
        expect(res.getStatus()).to.equal(200);
        expect(res.body.paymentId, "paymentId da renovação capturado").to.be.a('string');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
