info:
  name: Criar pagamento
  type: http
  seq: 2

http:
  method: POST
  url: "{{mockGatewayUrl}}/v1/payments"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "assinatura-uuid-123"
  body:
    type: json
    data: |-
      {
        "externalReference": "assinatura-uuid-123",
        "amount": 3990,
        "currency": "BRL",
        "paymentMethod": "PIX",
        "notificationUrl": "http://pagamento:8080/webhooks/payments"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("paymentId", res.body.id);

settings:
  encodeUrl: true
